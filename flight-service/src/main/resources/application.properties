spring.application.name=flight-service

# --- Datasource defaults ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-flight:5432/flightdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SQL init ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/init.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=true
